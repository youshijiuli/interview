<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>flask框架中的cookie和session技术</title>
</head>
<body>

    <h4>flask中cookie怎么使用</h4>

        <a href="/login/">登录</a>
    {% endif %}
