{% load static %}
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'bootstrap-3.4.1/dist/css/bootstrap.min.css' %}">
</head>
<body>

<div class="container" style="margin-top: 10px 0;">
    <div class="panel panel-default">
        <div class="panel-heading">修改药品信息</div>
        <div class="panel-body">
            <form class="form-inline" method="post" action="/add/goods/?id={{drug_obj.id}}">
                {% csrf_token %}
                 <div class="form-group">
                    <label class="sr-only">药品名</label>
                    <input type="text" class="form-control" name="drug_name" placeholder="药品名" value="{{drug_obj.drug_name}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">商品号</label>
                    <input type="text" class="form-control" name="product_id" placeholder="商品号" value="{{drug_obj.product_id}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">产地</label>
                    <input type="text" class="form-control" name="product_place" placeholder="产地" value="{{drug_obj.product_place}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">药品类别</label>
                    <input type="text" class="form-control" name="type" placeholder="药品类别" value="{{drug_obj.type}}">
                </div>
                <div class="form-group">
                    <select class="form-control" name="type">
                        <option value="1">感冒药</option>
                        <option value="2">消炎药</option>
                        <option value="3">壮阳药</option>
                        <option value="4">毒药</option>
                        <option value="5">眼药水</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="sr-only">进价</label>
                    <input type="text" class="form-control" name="in_price" placeholder="进价" value="{{drug_obj.in_price}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">单价</label>
                    <input type="text" class="form-control" name="single_price" placeholder="单价" value="{{drug_obj.single_price}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">会员折扣</label>
                    <input type="text" class="form-control" name="discount" placeholder="会员折扣" value="{{drug_obj.discount}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">库存量</label>
                    <input type="text" class="form-control" name="package" placeholder="库存量" value="{{drug_obj.package}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">规格</label>
                    <input type="text" class="form-control" name="size" placeholder="规格" value="{{drug_obj.size}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">生产日期</label>
                    <input type="text" class="form-control" name="pro_date" placeholder="生产日期" value="{{drug_obj.pro_date}}">
                </div>
                <div class="form-group">
                    <label class="sr-only">有效期</label>
                    <input type="text" class="form-control" name="valid_date" placeholder="有效期" value="{{drug_obj.valid_date}}">
                </div>

                <button type="submit" class="btn btn-primary">保存</button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
