{% extends 'layout1.html' %}
{% block content %}

<div class="container" style="margin-top: 10px 0;">
    <div class="panel panel-default">
        <div class="panel-heading">修改购买数量</div>
        <form class="form-inline" method="post" action="/number/revise/?id={{in_out_obj.id}}">
            <div class="form-group">
                <div class="form-group">
                    <label class="sr-only">订单数量</label>
                    <input type="number" class="form-control" name="number" placeholder="数量"
                           value="{{in_out_obj.number}}">
                </div>
                <button type="submit" class="btn btn-primary">提交修改</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
