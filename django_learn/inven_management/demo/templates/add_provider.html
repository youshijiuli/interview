{% load static %}
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'bootstrap-3.4.1/dist/css/bootstrap.min.css' %}">
</head>
<body>

<div class="container">
    <div class="panel panel-default">
        <div class="panel-heading">添加供应商</div>
        <div class="panel-body">
            <form class="form-inline" method="post" action="/add/provider/">
                {% csrf_token %}
                <div class="form-group">
                    <label class="sr-only">ID</label>
                    <input type="text" class="form-control" name="provider_id" placeholder="ID">
                </div>
                <div class="form-group">
                    <label class="sr-only">供应商名称</label>
                    <input type="text" class="form-control" name="pro_name" placeholder="供应商名称">
                </div>
                <div class="form-group">
                    <label class="sr-only">联系人</label>
                    <input type="text" class="form-control" name="linkman" placeholder="联系人">
                </div>
                <div class="form-group">
                    <label class="sr-only">联系方式</label>
                    <input type="text" class="form-control" name="linkWay" placeholder="联系方式">
                </div>
                <div class="form-group">
                    <label class="sr-only">城市</label>
                    <input type="text" class="form-control" name="city" placeholder="城市">
                </div>

                <button type="submit" class="btn btn-primary">保存</button>
            </form>

        </div>
    </div>

</div>
</body>
</html>
